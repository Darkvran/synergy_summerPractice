<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Интерактивный калькулятор</h2>
        
        <div class="inputs-container">
            <input type="text" id="num1" placeholder="Число 1">
            <input type="text" id="num2" placeholder="Число 2">
        </div>

        <div class="buttons-container">
            <button class="calc-btn" data-op="add">сумма</button>
            <button class="calc-btn" data-op="sub">разность</button>
            <button class="calc-btn" data-op="mul">произведение</button>
            <button class="calc-btn" data-op="div">деление</button>
        </div>

        <div id="result" class="result-box">Результат</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
