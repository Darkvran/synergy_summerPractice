<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Greeting App</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: sans-serif;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        .form-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .greeting {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2b6cb0;
        }
        .errorlist {
            color: #e53e3e;
            list-style: none;
            padding: 0;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Представьтесь</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.name.errors }}
            {{ form.name }}
            <button type="submit">Submit</button>
        </form>

        {% if greeting %}
            <div class="greeting">{{ greeting }}</div>
        {% endif %}
    </div>

</body>
</html>
